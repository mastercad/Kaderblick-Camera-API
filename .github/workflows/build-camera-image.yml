name: Kamera-Image bauen

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: pi-gen fest versioniert auschecken
        shell: bash
        run: |
          git clone --no-checkout https://github.com/RPi-Distro/pi-gen.git /tmp/pi-gen
          git -C /tmp/pi-gen checkout 05a772481a892663bc8974b72ae50aab684e92bb

      - name: Kaderblick-Stage vorbereiten
        shell: bash
        run: |
          chmod +x image-builder/prepare-stage.sh
          image-builder/prepare-stage.sh "$GITHUB_WORKSPACE" /tmp/pi-gen
          cp image-builder/config /tmp/pi-gen/kaderblick-config

      - name: ARM64-Emulation installieren
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          command -v qemu-aarch64-static

      - name: Raspberry-Pi-Image bauen
        working-directory: /tmp/pi-gen
        shell: bash
        run: sudo ./build-docker.sh -c kaderblick-config

      - name: Image benennen und Prüfsumme erstellen
        shell: bash
        run: |
          image_file=$(find /tmp/pi-gen/deploy -maxdepth 1 -type f -name '*.img.xz' -print -quit)
          test -n "$image_file"
          version="${GITHUB_REF_NAME:-development}"
          output="kaderblick-camera-os-${version}.img.xz"
          cp "$image_file" "$output"
          sha256sum "$output" > "$output.sha256"

      - name: Image-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: camera-image
          path: |
            kaderblick-camera-os-*.img.xz
            kaderblick-camera-os-*.img.xz.sha256
          if-no-files-found: error
          retention-days: 14
