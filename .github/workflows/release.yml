name: Veröffentlichung

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  runtime:
    uses: ./.github/workflows/build-camera-runtime.yml

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: setup-linux
          - os: windows-2022
            artifact: setup-windows
          - os: macos-15
            artifact: setup-macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: setup-tool
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: setup-tool/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            setup-tool/dist/*.AppImage
            setup-tool/dist/*.deb
            setup-tool/dist/*.dmg
            setup-tool/dist/*.exe
            setup-tool/dist/*.zip
          if-no-files-found: error

  release:
    needs: [runtime, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
